# HTTP-only bootstrap (no TLS files required).
# After certbot: enable 01-tls.conf.example → 01-tls.conf (see deploy/init-ssl.sh).

upstream website_upstream {
  server website:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.bobrov-sexolog.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 http://bobrov-sexolog.ru$request_uri;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name bobrov-sexolog.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://website_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
