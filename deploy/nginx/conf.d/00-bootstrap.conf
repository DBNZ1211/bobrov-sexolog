# Bootstrap HTTP config for first certificate issuance.
# After certbot succeeds, switch to bobrov-sexolog.ru.conf (TLS).

upstream website_upstream {
  server website:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name bobrov-sexolog.ru www.bobrov-sexolog.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://website_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
