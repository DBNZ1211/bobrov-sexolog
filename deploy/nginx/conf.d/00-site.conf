# Always-on HTTP + HTTPS. Certs: Let's Encrypt or self-signed via deploy/ensure-certs.sh

upstream website_upstream {
  server website:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name bobrov-sexolog.ru www.bobrov-sexolog.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://bobrov-sexolog.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.bobrov-sexolog.ru;

  ssl_certificate     /etc/letsencrypt/live/bobrov-sexolog.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bobrov-sexolog.ru/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://bobrov-sexolog.ru$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bobrov-sexolog.ru;

  ssl_certificate     /etc/letsencrypt/live/bobrov-sexolog.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bobrov-sexolog.ru/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://website_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Document uploads / preview regen can be slow on small VPS
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_body_timeout 300s;
  }
}
