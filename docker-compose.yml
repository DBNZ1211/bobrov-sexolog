services:
  website:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      NODE_OPTIONS: --experimental-sqlite
      # Nuxt runtimeConfig reads NUXT_* at runtime (ADMIN_* alone is not enough after build)
      NUXT_ADMIN_USER: ${ADMIN_USER:-admin}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NUXT_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NUXT_DATA_DIR: /app/data
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://bobrov-sexolog.ru}
      NUXT_OG_IMAGE_SECRET: ${NUXT_OG_IMAGE_SECRET:-}
    volumes:
      - ./data:/app/data
    networks:
      - web
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - web

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  web:
    driver: bridge
