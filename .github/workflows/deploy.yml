name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          SSH_USER: ${{ secrets.USER }}
          SSHPASS: ${{ secrets.PASSWORD }}
          REPO: ${{ secrets.REPO_URL }}
        run: |
          set -euo pipefail

          PORT="${PORT:-22}"

          if [ -z "${HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSHPASS:-}" ] || [ -z "${REPO:-}" ]; then
            echo "Missing required secrets: HOST, USER, PASSWORD, REPO_URL"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y sshpass

          # Secrets are expanded on the runner; remote script is then executed via bash -s.
          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          if [ ! -d /root/bobrov-sexolog/.git ]; then
            git clone "${REPO}" /root/bobrov-sexolog
          fi

          cd /root/bobrov-sexolog
          git fetch origin master
          git checkout -B master origin/master
          git reset --hard origin/master

          if [ ! -f .env ]; then
            echo ".env is missing on the server. Create it once from .env.example before deploy."
            exit 1
          fi

          # Nuxt/Nitro build needs ~1.5–2G; small VPS often OOM (exit 137) without swap.
          if ! swapon --show | grep -q .; then
            echo "No swap detected — creating 2G /swapfile for Docker build..."
            fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
          fi
          free -h || true

          export DOCKER_BUILDKIT=1
          # Plain progress keeps SSH traffic alive during long nitro/fonts steps.
          docker compose -f docker-compose.yml build --progress=plain website
          docker compose -f docker-compose.yml up -d --force-recreate website
          docker compose -f docker-compose.yml up -d nginx
          docker compose -f docker-compose.yml exec -T nginx nginx -s reload || true
          docker image prune -f
          EOF
          )

          # Keepalive prevents NAT/firewall from dropping idle SSH mid-build
          # (client_loop: send disconnect: Broken pipe).
          sshpass -e \
            ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            -p "$PORT" \
            "${SSH_USER}@${HOST}" \
            "bash -s" <<< "$REMOTE_SCRIPT"
